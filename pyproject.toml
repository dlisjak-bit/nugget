[project]
name = "chicken-bot"
version = "0.1.0"
description = "Interactive robotics experiments for Chiken"
requires-python = ">=3.12,<3.14"
dependencies = [
  "mujoco>=3.3,<5",
  "numpy>=2,<3",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chicken_bot"]

[project.scripts]
chicken-viewer = "chicken_bot.launcher:launch"

[dependency-groups]
dev = [
    "trimesh>=5.2.0",
]
