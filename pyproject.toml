[project]
name = "nugget"
version = "0.1.0"
description = "Interactive robotics experiments for Nugget"
requires-python = ">=3.12,<3.14"
dependencies = [
  "gymnasium[mujoco]>=1.4.0",
  "mujoco>=3.3,<5",
  "numpy>=2,<3",
  "torch>=2.15.0",
  "moviepy>=2,<3",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nugget"]

[project.scripts]
nugget-viewer = "nugget.launcher:launch"

[dependency-groups]
dev = [
    "trimesh>=5.2.0",
]
